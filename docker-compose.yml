services:
  analysis:
    build: .  # Use local Dockerfile to build the image instead of pulling from DockerHub
    ports:
      - "8888:8888"  # Expose Jupyter Notebook instead of RStudio
    volumes:
      - .:/home/jovyan/work  # Ensure local files match container working directory
    restart: unless-stopped
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"] #launch JupyterLab
